services:
  redis:
    extends:
      file: docker-compose.yml
      service: redis
    restart: always

  backend:
    extends:
      file: docker-compose.yml
      service: backend
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - backend_logs:/app/logs
      - reports_tmp:/tmp/reports
      - ${AEAT_CERTS_HOST_DIR:-./backend/certs}:/run/secrets/aeat-certs:ro

  frontend:
    extends:
      file: docker-compose.yml
      service: frontend
    restart: always

  nginx:
    extends:
      file: docker-compose.yml
      service: nginx
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
      - letsencrypt_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  certbot:
    image: certbot/certbot:latest
    restart: always
    volumes:
      - letsencrypt_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c
    command: "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet || true; sleep 12h; done"
    depends_on:
      nginx:
        condition: service_started
    networks:
      - ab_logistics_net

volumes:
  redis_data:
  backend_logs:
  frontend_logs:
  nginx_logs:
  reports_tmp:
  letsencrypt_data:
  certbot_www:

networks:
  ab_logistics_net:
    driver: bridge
